name: Smoke on one Linux architecture

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      native_artifact:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Check the ARM64 cross-build
        if: inputs.arch == 'aarch64'
        env:
          NATIVE_ARTIFACT: ${{ inputs.native_artifact }}
        run: test -n "$NATIVE_ARTIFACT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: inputs.arch == 'aarch64'
        with:
          artifact-ids: ${{ inputs.native_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/arm-native
      - name: Build all baselines
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          if [[ "$EXPECTED_ARCH" == aarch64 ]]; then
            export PREBUILT_KOTLIN_DIR="$RUNNER_TEMP/arm-native"
          fi
          ./scripts/build-all.sh
      - name: Check HTTP parity
        run: ./scripts/smoke-all.sh
      - name: Verify the optional application workload
        run: BENCHMARK_SUITE=application ./scripts/smoke-all.sh
      - name: Check epoll worker parity and shutdown
        env:
          PORT: '18079'
        run: |
          ROOT="$PWD"
          source scripts/server-process.sh
          trap stop_server EXIT
          log="$RUNNER_TEMP/ktserve-workers.log"
          for variant in ktserve-workers-2 ktserve-workers-2-reuseport; do
            start_server "$variant" "$log"
            ./scripts/smoke.sh "http://127.0.0.1:$PORT"
            python3 scripts/tests/ktserve_http_smoke.py "$PORT"
            python3 scripts/tests/ktserve_shutdown_smoke.py "$PORT" "$server_pid"
            wait "$server_pid"
            server_pid=''
            start_server "$variant" "$log"
            stop_server
          done
      - name: Exercise ktServe resource bounds
        env:
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          if [[ "$EXPECTED_ARCH" == aarch64 ]]; then
            fixture="$RUNNER_TEMP/arm-native/ktserve-stress-fixture.kexe"
            chmod +x "$fixture"
          else
            gradle -p components/ktserve linkStressReleaseExecutableNative
            fixture=components/ktserve/build/bin/native/stressReleaseExecutable/ktserve-stress-fixture.kexe
          fi
          python3 scripts/tests/ktserve_stress.py "$fixture"
      - name: Verify the separate ktServe consumer
        env:
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          if [[ "$EXPECTED_ARCH" == aarch64 ]]; then
            binary="$RUNNER_TEMP/arm-native/hello.kexe"
            chmod +x "$binary"
          else
            example=components/ktserve/examples/hello
            ./components/ktserve/gradlew -p "$example" linkReleaseExecutableNative
            binary="$example/build/bin/native/releaseExecutable/hello.kexe"
          fi
          "$binary" 18080 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:18080
          test "$(curl -fsS --retry 8 --retry-connrefused --retry-max-time 10 "$base/health")" = ok
          test "$(curl -fsS "$base/")" = 'Hello from ktServe'
          kill -0 "$pid"
      - name: Verify and run the ktServe release archive
        env:
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          binary=components/ktserve/build/bin/native/releaseExecutable/ktserve.kexe
          version="snapshot-${GITHUB_SHA:0:12}"
          archive="ktserve-$version-linux-$EXPECTED_ARCH.tar.gz"
          package="$RUNNER_TEMP/ktserve-release"
          second_build="$RUNNER_TEMP/ktserve-repack"
          ./scripts/package-ktserve.sh "$binary" "$version" "$package"
          ./scripts/package-ktserve.sh "$binary" "$version" "$second_build"
          cmp "$package/$archive" "$second_build/$archive"
          unpacked="$RUNNER_TEMP/ktserve-unpacked"
          mkdir "$unpacked"
          (cd "$package" && sha256sum --strict -c "$archive.sha256")
          tar -xzf "$package/$archive" -C "$unpacked"
          cmp "$binary" "$unpacked/ktserve"
          PORT=18081 "$unpacked/ktserve" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:18081
          curl -fsS --retry 8 --retry-connrefused --retry-max-time 10 "$base/health"
          ./scripts/smoke.sh "$base"
          kill -0 "$pid"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ktserve-linux-${{ inputs.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ktserve-release
          if-no-files-found: error
