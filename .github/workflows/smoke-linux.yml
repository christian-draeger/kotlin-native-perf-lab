name: Smoke on one Linux architecture

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      native_artifact:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Check the ARM64 cross-build
        if: inputs.arch == 'aarch64'
        env:
          NATIVE_ARTIFACT: ${{ inputs.native_artifact }}
        run: test -n "$NATIVE_ARTIFACT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: inputs.arch == 'aarch64'
        with:
          artifact-ids: ${{ inputs.native_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/arm-native
      - name: Build all baselines
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          if [[ "$EXPECTED_ARCH" == aarch64 ]]; then
            export PREBUILT_KOTLIN_DIR="$RUNNER_TEMP/arm-native"
          fi
          ./scripts/build-all.sh
      - name: Check HTTP parity
        run: ./scripts/smoke-all.sh
      - name: Exercise reactor resource bounds
        env:
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          if [[ "$EXPECTED_ARCH" == aarch64 ]]; then
            fixture="$RUNNER_TEMP/arm-native/reactor-stress-fixture.kexe"
            chmod +x "$fixture"
          else
            gradle -p kotlin-reactor linkStressReleaseExecutableNative
            fixture=kotlin-reactor/build/bin/native/stressReleaseExecutable/reactor-stress-fixture.kexe
          fi
          python3 scripts/tests/reactor_stress.py "$fixture"
