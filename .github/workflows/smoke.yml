name: Ubuntu x86_64 smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build all baselines
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
        run: |
          test "$(uname -m)" = x86_64
          ./scripts/build-all.sh
      - name: Check HTTP parity
        run: ./scripts/smoke-all.sh
      - name: Collect phase-0 diagnostic profiles
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/phase-0-baseline' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wrk linux-tools-generic
          export PERF_BIN="$(find /usr/lib/linux-tools -name perf -type f | sort -V | tail -1)"
          PERF_SUDO=1 ./scripts/profile.sh "$RUNNER_TEMP/phase0-profiles"
      - name: Upload diagnostic samples
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/phase-0-baseline' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: phase0-profiles
          path: ${{ runner.temp }}/phase0-profiles
          if-no-files-found: error
