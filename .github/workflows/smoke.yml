name: Ubuntu smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: ./scripts/check-fast.sh

  x86_smoke:
    uses: ./.github/workflows/smoke-linux.yml
    with:
      arch: x86_64
      runner: ubuntu-24.04

  arm_native:
    uses: ./.github/workflows/arm-native.yml

  arm_smoke:
    needs: arm_native
    uses: ./.github/workflows/smoke-linux.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm
      native_artifact: ${{ needs.arm_native.outputs.artifact_id }}
