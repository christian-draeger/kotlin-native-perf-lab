name: Ubuntu smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: ./scripts/check-fast.sh --static

  ktserve_unit:
    name: ktServe JVM tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./components/ktserve/gradlew -p components/ktserve jvmTest
      - name: Test optional ktServe extensions on the JVM
        if: matrix.arch == 'x86_64'
        env:
          KTSERVE_CI_GRADLE_COMMAND: ./components/ktserve/gradlew
        run: bash scripts/ci-gradle.sh -p components/ktserve/extensions jvmTest
      - name: Verify a separate JVM consumer
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          example=components/ktserve/examples/hello-jvm
          ./components/ktserve/gradlew -p "$example" installDist
          "$example/build/install/ktserve-hello-jvm/bin/ktserve-hello-jvm" 18080 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:18080
          test "$(curl -fsS --retry 8 --retry-connrefused --retry-max-time 10 "$base/health")" = ok
          test "$(curl -fsS "$base/")" = 'Hello from ktServe on the JVM'
      - name: Verify the standalone REST consumer
        run: |
          example=components/ktserve/examples/rest-jvm
          ./components/ktserve/gradlew -p "$example" installDist
          python3 "$example/smoke.py" "$example/build/install/ktserve-rest-jvm/bin/ktserve-rest-jvm"

  ktserve_cli:
    name: ktServe Native CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Verify typed apps from the standalone Native CLI
        env:
          KTSERVE_CI_GRADLE_COMMAND: ./components/ktserve/gradlew
        run: |
          cli=components/ktserve/experiments/cli
          bash scripts/ci-gradle.sh -p "$cli/static" linkReleaseExecutableNative
          binary="$cli/static/build/bin/native/releaseExecutable/ktserve.kexe"
          python3 "$cli/static/smoke.py" "$binary"
          python3 "$cli/run/typed_smoke.py" "$binary"

  x86_smoke:
    uses: ./.github/workflows/smoke-linux.yml
    with:
      arch: x86_64
      runner: ubuntu-24.04

  arm_native:
    uses: ./.github/workflows/arm-native.yml
    permissions:
      contents: read
      actions: read
    with:
      smoke_fixtures: true

  arm_smoke:
    needs: arm_native
    uses: ./.github/workflows/smoke-linux.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm
      native_artifact: ${{ needs.arm_native.outputs.artifact_id }}
