name: ktServe integration benchmarks

on:
  pull_request:
    paths:
      - 'components/nativeserve/benchmarks/**'
      - 'components/nativeserve/integrations/**'
      - 'components/nativeserve/src/**'
      - 'scripts/benchmark-integrations.py'
      - 'scripts/k6-integration.js'
      - 'scripts/parse_wrk.py'
      - 'scripts/proc_metrics.py'
      - 'scripts/wrk-stats.lua'
      - '.github/workflows/integration-benchmarks.yml'
  workflow_dispatch:
    inputs:
      application:
        description: Measure all apps, the JVM apps, or one application on both Linux architectures
        type: choice
        options: [all, jvm, ktor-native, ktor-jvm, spring-webflux]
        default: all
      load_tool:
        description: Mixed k6 arrival rates or historical wrk single-endpoint runs
        type: choice
        options: [k6, wrk]
        default: k6

permissions:
  contents: read

jobs:
  arm_build:
    name: Cross-link the Kotlin/Native Ktor app for ARM64
    if: github.event_name == 'pull_request' || inputs.application == 'all' || inputs.application == 'ktor-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - name: Link the release app
        run: |
          project=components/nativeserve/integrations/ktor
          binary="$project/build/bin/native/releaseExecutable/nativeserve-ktor-example.kexe"
          bash scripts/ci-gradle.sh -p "$project" -Pbenchmark.targetArch=aarch64 linkReleaseExecutableNative
          readelf -h "$binary" | grep -E 'Machine:[[:space:]]+AArch64$'
          install -D "$binary" "$RUNNER_TEMP/integration-arm/ktor-example"
          gradle --version > "$RUNNER_TEMP/integration-arm/gradle-version.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: upload
        with:
          name: ktserve-integration-arm-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-arm
          if-no-files-found: error

  benchmark:
    name: ${{ matrix.family }} (${{ matrix.arch }})
    needs: arm_build
    if: ${{ !cancelled() && (needs.arm_build.result == 'success' || needs.arm_build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        family: >-
          ${{ fromJSON(inputs.application == 'ktor-native' && '["ktor-native"]'
            || inputs.application == 'ktor-jvm' && '["ktor-jvm"]'
            || inputs.application == 'spring-webflux' && '["spring-webflux"]'
            || inputs.application == 'jvm' && '["ktor-jvm", "spring-webflux"]'
            || '["ktor-native", "ktor-jvm", "spring-webflux"]') }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      FAMILY: ${{ matrix.family }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      RUNNER_LABEL: ${{ matrix.runner }}
      LOAD_TOOL: ${{ inputs.load_tool || 'k6' }}
      LC_ALL: C
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare the output directory
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          result="$RUNNER_TEMP/integration-results/$(date -u +%Y%m%dT%H%M%SZ)-$FAMILY-$EXPECTED_ARCH"
          mkdir -p "$result"
          printf 'RESULT_DIR=%s\n' "$result" >> "$GITHUB_ENV"
          {
            printf 'benchmark_source=github-hosted-actions\nrunner_label=%s\n' "$RUNNER_LABEL"
            printf 'ci_run_id=%s\nci_run_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            grep '^PRETTY_NAME=' /etc/os-release
            printf 'kotlin_version=%s\n' "$(sed -n 's/.*kotlin("multiplatform") version "\([^"]*\)".*/\1/p' components/nativeserve/integrations/ktor/build.gradle.kts)"
          } > "$result/environment.txt"
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: matrix.family != 'ktor-native' || matrix.arch == 'x86_64'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: matrix.family != 'ktor-native' || matrix.arch == 'x86_64'
        with:
          gradle-version: '9.7.0'
      - name: Build the JVM application
        if: matrix.family != 'ktor-native'
        run: |
          app="ktserve-benchmark-$FAMILY"
          project="components/nativeserve/benchmarks/$FAMILY"
          bash scripts/ci-gradle.sh -p "$project" installDist
          printf 'EXECUTABLE=%s\n' "$project/build/install/$app/bin/$app" >> "$GITHUB_ENV"
          gradle --version > "$RESULT_DIR/gradle-version.txt"
      - name: Link the x86_64 app
        if: matrix.family == 'ktor-native' && matrix.arch == 'x86_64'
        run: |
          project=components/nativeserve/integrations/ktor
          bash scripts/ci-gradle.sh -p "$project" -Pbenchmark.targetArch=x86_64 linkReleaseExecutableNative
          printf 'EXECUTABLE=%s\n' "$project/build/bin/native/releaseExecutable/nativeserve-ktor-example.kexe" >> "$GITHUB_ENV"
          gradle --version > "$RESULT_DIR/gradle-version.txt"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.family == 'ktor-native' && matrix.arch == 'aarch64'
        with:
          artifact-ids: ${{ needs.arm_build.outputs.artifact_id }}
          path: ${{ runner.temp }}/integration-arm
      - name: Prepare the ARM64 app
        if: matrix.family == 'ktor-native' && matrix.arch == 'aarch64'
        run: |
          chmod +x "$RUNNER_TEMP/integration-arm/ktor-example"
          printf 'EXECUTABLE=%s\n' "$RUNNER_TEMP/integration-arm/ktor-example" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/integration-arm/gradle-version.txt" "$RESULT_DIR/"
      - name: Check response parity
        if: github.event_name == 'pull_request'
        id: smoke
        run: python3 scripts/benchmark-integrations.py --family "$FAMILY" --executable "$EXECUTABLE" --output "$RESULT_DIR" --smoke-only
      - name: Install the load generator
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          if [[ "$LOAD_TOOL" == wrk ]]; then
            sudo apt-get install -y wrk time
            exit
          fi
          sudo apt-get install -y time
          case "$EXPECTED_ARCH" in
            x86_64) arch=amd64; digest=5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87 ;;
            aarch64) arch=arm64; digest=7bb415f59d81ad649a86f6da6b3e1bd2e4e64e84909deef13e9bca70608abccb ;;
          esac
          asset="k6-v2.4.0-linux-$arch.tar.gz"
          curl -fsSL --retry 3 "https://github.com/grafana/k6/releases/download/v2.4.0/$asset" -o "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$asset" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/$asset" --strip-components=1 -C "$RUNNER_TEMP" "k6-v2.4.0-linux-$arch/k6"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Measure the engines in isolation
        if: github.event_name == 'workflow_dispatch'
        id: measure
        run: |
          duration=5
          if [[ "$LOAD_TOOL" == k6 ]]; then duration=15; fi
          python3 scripts/benchmark-integrations.py --family "$FAMILY" --executable "$EXECUTABLE" \
            --output "$RESULT_DIR" --load-tool "$LOAD_TOOL" --duration "$duration"
      - name: Record outcome
        if: ${{ !cancelled() && env.RESULT_DIR != '' }}
        env:
          BENCHMARK_OUTCOME: ${{ github.event_name == 'pull_request' && steps.smoke.outcome || steps.measure.outcome }}
        run: |
          if [[ "$BENCHMARK_OUTCOME" != success ]]; then BENCHMARK_OUTCOME=failure; fi
          printf 'benchmark_outcome=%s\n' "$BENCHMARK_OUTCOME" >> "$RESULT_DIR/environment.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() && env.RESULT_DIR != '' }}
        with:
          name: integration-benchmark-${{ matrix.family }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-results
          if-no-files-found: error
