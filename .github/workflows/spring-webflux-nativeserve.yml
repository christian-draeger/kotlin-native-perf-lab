name: NativeServe Spring WebFlux

on:
  pull_request:
    paths:
      - 'components/nativeserve/integrations/webflux/**'
      - 'components/nativeserve/src/commonMain/**'
      - 'components/nativeserve/src/jvmMain/**'
      - 'scripts/ci-gradle.sh'
      - 'scripts/ci-maven-central-mirror.gradle'
      - '.github/workflows/spring-webflux-nativeserve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webflux:
    name: WebFlux adapter (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - run: bash scripts/ci-gradle.sh -p components/nativeserve/integrations/webflux test
