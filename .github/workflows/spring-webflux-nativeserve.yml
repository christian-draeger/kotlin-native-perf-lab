name: NativeServe Spring WebFlux

on:
  pull_request:
    paths:
      - 'components/nativeserve/integrations/webflux/**'
      - 'components/nativeserve/integrations/spring-boot-starter/**'
      - 'components/nativeserve/examples/spring-webflux/**'
      - 'components/nativeserve/src/commonMain/**'
      - 'components/nativeserve/src/jvmMain/**'
      - 'scripts/ci-gradle.sh'
      - 'scripts/ci-maven-central-mirror.gradle'
      - '.github/workflows/spring-webflux-nativeserve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webflux:
    name: WebFlux adapter (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - run: bash scripts/ci-gradle.sh -p components/nativeserve/integrations/webflux test
      - name: Test startup, server selection and graceful shutdown
        run: bash scripts/ci-gradle.sh -p components/nativeserve/integrations/spring-boot-starter test
      - name: Build and exercise an independent Spring Boot consumer
        run: |
          starter=components/nativeserve/examples/spring-webflux
          bash scripts/ci-gradle.sh -p "$starter" installDist
          NATIVESERVE_ENABLED=true SERVER_ADDRESS=127.0.0.1 SERVER_PORT=18090 \
            "$starter/build/install/nativeserve-spring-hello/bin/nativeserve-spring-hello" > "$RUNNER_TEMP/spring-starter.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if [ "$(curl -fsS http://127.0.0.1:18090/health 2>/dev/null)" = '{"status":"ok"}' ]; then
              grep -F 'NativeServe backend=nio' "$RUNNER_TEMP/spring-starter.log"
              exit 0
            fi
            if ! kill -0 "$server"; then break; fi
            sleep .1
          done
          cat "$RUNNER_TEMP/spring-starter.log"
          exit 1
