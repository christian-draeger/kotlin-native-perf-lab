name: macOS smoke

on:
  push:
    branches: [main]
    paths: &paths
      - 'LICENSE'
      - 'components/ktserve/**'
      - 'scripts/package-ktserve.sh'
      - 'scripts/smoke.sh'
      - 'scripts/tests/ktserve_*.py'
      - '.github/workflows/smoke-macos.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ktServe (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build release executables and run portable tests
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          project=components/ktserve
          "$project/gradlew" -p "$project" -Pbenchmark.targetOs=macos \
            jvmTest linkReleaseExecutableNative linkStressReleaseExecutableNative
          "$project/gradlew" -p "$project/examples/hello" -Pbenchmark.targetOs=macos linkReleaseExecutableNative
      - name: Test transport and resource contracts
        run: |
          fixture=components/ktserve/build/macos/bin/native/stressReleaseExecutable/ktserve-stress-fixture.kexe
          python3 scripts/tests/ktserve_stress.py "$fixture"
      - name: Verify the packaged release and checkout consumer
        run: |
          project=components/ktserve
          binary="$project/build/macos/bin/native/releaseExecutable/ktserve.kexe"
          version="snapshot-${GITHUB_SHA:0:12}"
          archive="ktserve-$version-macos-arm64.tar.gz"
          package="$RUNNER_TEMP/ktserve-release"
          repeat="$RUNNER_TEMP/ktserve-repack"
          ./scripts/package-ktserve.sh "$binary" "$version" "$package"
          ./scripts/package-ktserve.sh "$binary" "$version" "$repeat"
          cmp "$package/$archive" "$repeat/$archive"
          (cd "$package" && shasum -a 256 -c "$archive.sha256")
          unpacked="$RUNNER_TEMP/ktserve-unpacked"
          mkdir "$unpacked"
          tar -xzf "$package/$archive" -C "$unpacked"
          cmp "$binary" "$unpacked/ktserve"
          cmp LICENSE "$unpacked/LICENSE"

          export PORT=18081
          "$unpacked/ktserve" > "$RUNNER_TEMP/native-startup.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          base="http://127.0.0.1:$PORT"
          curl -fsS --retry 8 --retry-connrefused --retry-max-time 10 "$base/health"
          ./scripts/smoke.sh "$base"
          python3 scripts/tests/ktserve_http_smoke.py "$PORT"
          python3 scripts/tests/ktserve_shutdown_smoke.py "$PORT" "$pid" "$unpacked/ktserve"
          wait "$pid"
          grep -Fx 'ktServe backend=kqueue tcp=ipv4' "$RUNNER_TEMP/native-startup.log"

          "$project/examples/hello/build/macos/bin/native/releaseExecutable/hello.kexe" "$PORT" &
          pid=$!
          test "$(curl -fsS --retry 8 --retry-connrefused --retry-max-time 10 "$base/")" = 'Hello from ktServe'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ktserve-macos-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ktserve-release
          if-no-files-found: error
