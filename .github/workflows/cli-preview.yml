name: ktServe CLI preview

on:
  push:
    tags: ['cli-preview-*']
  pull_request:
    paths:
      - '.github/workflows/cli-preview.yml'
      - 'components/ktserve/experiments/cli/**'
      - 'scripts/ci-gradle.sh'
      - 'scripts/package-ktserve.sh'
      - 'scripts/smoke-ktserve-cli-package.sh'
  workflow_dispatch:
    inputs:
      version:
        description: Preview version to build and test
        required: true
        type: string

env:
  CLI_PREVIEW_TAG: ${{ github.event_name == 'pull_request' && 'cli-preview-0.0.0' || github.event_name == 'workflow_dispatch' && format('cli-preview-{0}', inputs.version) || github.ref_name }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ktserve-cli-preview-${{ github.ref }}

jobs:
  arm_openssl:
    name: Fetch the Ubuntu ARM64 OpenSSL SDK
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Download the signed distribution packages
        run: |
          test "$(dpkg --print-architecture)" = arm64
          sudo apt-get update -qq
          mkdir "$RUNNER_TEMP/arm-openssl"
          cd "$RUNNER_TEMP/arm-openssl"
          apt-get download libssl-dev libssl3t64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: arm-openssl
          path: ${{ runner.temp }}/arm-openssl/*.deb
          if-no-files-found: error
          overwrite: true

  package:
    name: Build CLI preview (${{ matrix.platform }} ${{ matrix.arch }})
    needs: arm_openssl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            host_arch: x86_64
            runner: ubuntu-24.04
          - platform: linux
            arch: aarch64
            host_arch: x86_64
            runner: ubuntu-24.04
          - platform: macos
            arch: arm64
            host_arch: arm64
            runner: macos-15
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build the native HTTP CLI
        env:
          HOST_ARCH: ${{ matrix.host_arch }}
        run: |
          [[ "$CLI_PREVIEW_TAG" =~ ^cli-preview-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = "$HOST_ARCH"
          project=components/ktserve
          KTSERVE_CI_GRADLE_COMMAND="$project/gradlew" bash scripts/ci-gradle.sh -p "$project/experiments/cli/static" \
            "-Pbenchmark.targetOs=$TARGET_PLATFORM" "-Pbenchmark.targetArch=$TARGET_ARCH" \
            linkReleaseExecutableNative
      - name: Package the downloadable CLI
        run: |
          cli=components/ktserve/experiments/cli
          binary="$cli/static/build/bin/native/releaseExecutable/ktserve.kexe"
          package="$RUNNER_TEMP/cli-release"
          archive="ktserve-$CLI_PREVIEW_TAG-$TARGET_PLATFORM-$TARGET_ARCH.tar.gz"
          ./scripts/package-ktserve.sh "$binary" "$CLI_PREVIEW_TAG" "$package" --cli
          tar -xOzf "$package/$archive" ktserve | cmp "$binary" -
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.arch == 'aarch64'
        with:
          name: arm-openssl
          path: ${{ runner.temp }}/arm-openssl
      - name: Build and package the Linux HTTPS CLI
        if: matrix.platform == 'linux'
        run: |
          if [[ "$TARGET_ARCH" == aarch64 ]]; then
            sdk="$RUNNER_TEMP/arm-openssl"
            for package in "$sdk"/*_arm64.deb; do
              test "$(dpkg-deb -f "$package" Architecture)" = arm64
              dpkg-deb -x "$package" "$sdk"
            done
            openssl_root="$sdk/usr"
          else
            sudo apt-get update -qq
            sudo apt-get install -y libssl-dev
            openssl_root=/usr
          fi

          project=components/ktserve
          cli="$project/experiments/cli/static"
          KTSERVE_CI_GRADLE_COMMAND="$project/gradlew" bash scripts/ci-gradle.sh -p "$cli" "-Pbenchmark.targetArch=$TARGET_ARCH" \
            "-Pktserve.opensslRoot=$openssl_root" linkReleaseExecutableNative
          binary="$cli/build/bin/native/releaseExecutable/ktserve.kexe"
          package="$RUNNER_TEMP/cli-release"
          archive="ktserve-$CLI_PREVIEW_TAG-linux-$TARGET_ARCH-https.tar.gz"
          ./scripts/package-ktserve.sh "$binary" "$CLI_PREVIEW_TAG" "$package" --cli-https
          tar -xOzf "$package/$archive" ktserve | cmp "$binary" -
      - name: Export standalone CLI executables
        run: |
          cd "$RUNNER_TEMP/cli-release"
          for archive in *.tar.gz; do
            executable="${archive%.tar.gz}"
            tar -xOzf "$archive" ktserve > "$executable"
            chmod 755 "$executable"
            if [[ "$TARGET_PLATFORM" == linux ]]; then
              sha256sum "$executable" > "$executable.sha256"
            else
              shasum -a 256 "$executable" > "$executable.sha256"
            fi
          done
      - name: Test the downloadable CLI
        if: matrix.arch != 'aarch64'
        run: |
          test "$(uname -m)" = "$TARGET_ARCH"
          for archive in "$RUNNER_TEMP/cli-release/"*.tar.gz; do
            bash scripts/smoke-ktserve-cli-package.sh "$archive"
          done
          python3 -B components/ktserve/experiments/cli/static/run_preview_smoke.py \
            "$RUNNER_TEMP/cli-release/ktserve-$CLI_PREVIEW_TAG-$TARGET_PLATFORM-$TARGET_ARCH"
          python3 -B components/ktserve/experiments/cli/run/typed_smoke.py \
            "$RUNNER_TEMP/cli-release/ktserve-$CLI_PREVIEW_TAG-$TARGET_PLATFORM-$TARGET_ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cli-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cli-release/
          if-no-files-found: error
          overwrite: true

  verify_arm:
    name: Test CLI preview on Linux ARM64
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cli-preview-linux-aarch64
          path: ${{ runner.temp }}/cli-release
      - name: Test the downloadable HTTP and HTTPS CLIs
        run: |
          test "$(uname -m)" = aarch64
          for archive in "$RUNNER_TEMP/cli-release/"*.tar.gz; do
            bash scripts/smoke-ktserve-cli-package.sh "$archive"
          done
          python3 -B components/ktserve/experiments/cli/static/run_preview_smoke.py \
            "$RUNNER_TEMP/cli-release/ktserve-$CLI_PREVIEW_TAG-linux-aarch64"

  publish:
    name: Publish the CLI prerelease
    needs: verify_arm
    if: github.event_name == 'push' && github.repository_id == '1468028252' && github.repository_owner == 'christian-draeger'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cli-preview-*
          path: ${{ runner.temp }}/cli-release
          merge-multiple: true
      - name: Publish the verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CLI_PREVIEW_TAG" =~ ^cli-preview-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_commit="$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/cli-release"
          assets=()
          for target in linux-x86_64 linux-aarch64 macos-arm64 linux-x86_64-https linux-aarch64-https; do
            executable="ktserve-$CLI_PREVIEW_TAG-$target"
            for asset in "$executable" "$executable.tar.gz"; do
              test -s "$asset"
              sha256sum --strict -c "$asset.sha256"
              assets+=("$asset" "$asset.sha256")
            done
          done
          cat > release-notes.md <<'EOF'
          Download the standalone ktServe binary for your platform and save it as `ktserve`.
          Make it executable and pipe a JSON document into it:

          ```sh
          chmod +x ktserve
          printf '%s\n' '{"status":"ok"}' | ./ktserve serve -
          ```

          Test it with `curl -fsS http://127.0.0.1:8080/` in a second terminal.

          To try a Kotlin route from stdin, use:

          ```sh
          ./ktserve run - <<<'get("/health") { text("ok") }'
          ```

          Test it with `curl -fsS http://127.0.0.1:8080/health`.
          To configure an app explicitly, pass the full server call to `run --app -`:

          ```sh
          ./ktserve run --app - <<'KOTLIN'
          serve(port = 8081, host = "127.0.0.1") {
              get("/health") { text("ok") }
              get("/ready") { text("ready") }
          }
          KOTLIN
          ```

          Use `./ktserve run App.kt` for a complete Kotlin file with its own `main` function.
          Declare additional Maven Central dependencies before the filename:

          ```sh
          ./ktserve run --dependency org.jetbrains.kotlinx:kotlinx-datetime:0.7.1 App.kt
          ```

          Repeat `--dependency` as needed. Use fixed versions and artifacts that support your Kotlin/Native target.
          The CLI bundles the project inputs and compiles the app locally with the Gradle wrapper.
          The preview is tested with JDK 21 on Linux x86-64 and Apple Silicon macOS with full Xcode.
          [Kotlin stdin quickstart](https://christian-draeger.github.io/ktserve/docs.html#cli-kotlin)

          Run the typed example with validation and OpenAPI:

          ```sh
          curl -fsSLO TYPED_EXAMPLE_URL
          ./ktserve run --extension validation --extension openapi --source - < TypedApp.kt
          ```

          The `.tar.gz` downloads include a sample site. Extract the archive and serve the directory:

          ```sh
          ./ktserve serve ./public
          ```

          Open http://127.0.0.1:8080/ to try the included site. Every download has a SHA-256 checksum.

          Choose an HTTPS binary or archive for direct HTTPS on Linux x86-64 or ARM64.
          These builds use the system OpenSSL 3 libraries (`libssl3t64` on Ubuntu 24.04).
          Use your PEM certificate chain and its matching unencrypted key:

          ```sh
          PORT=8443 ./ktserve serve ./public --tls-cert fullchain.pem --tls-key key.pem
          ```

          [CLI documentation](https://christian-draeger.github.io/ktserve/docs.html#static-files)
          EOF
          sed -i "s|TYPED_EXAMPLE_URL|https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$source_commit/components/ktserve/experiments/cli/run/TypedApp.kt|" release-notes.md
          printf '\n[Source commit](https://github.com/%s/tree/%s/components/ktserve/experiments/cli)\n' \
            "$GITHUB_REPOSITORY" "$source_commit" >> release-notes.md
          printf '\n[Apache 2.0 license](https://github.com/%s/blob/%s/LICENSE)\n' \
            "$GITHUB_REPOSITORY" "$source_commit" >> release-notes.md
          gh release create "$CLI_PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title "ktServe CLI Preview ${CLI_PREVIEW_TAG#cli-preview-}" \
            --notes-file release-notes.md "${assets[@]}"
