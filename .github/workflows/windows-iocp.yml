name: NativeServe Windows IOCP

on:
  pull_request:
    paths:
      - 'components/nativeserve/experiments/windows-iocp/**'
      - 'components/nativeserve/src/commonMain/**'
      - 'components/nativeserve/src/nativeShared/**'
      - 'components/nativeserve/src/nativeStress/**'
      - 'components/nativeserve/gradlew.bat'
      - 'components/nativeserve/gradle/wrapper/**'
      - 'scripts/tests/reactor_*'
      - '.github/workflows/windows-iocp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build the Winsock probe, HTTP server and shared socket fixture
        shell: pwsh
        run: |
          $project = 'components/nativeserve/experiments/windows-iocp'
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          & ./components/nativeserve/gradlew.bat -p $project linkReleaseExecutableMingwX64 linkServerReleaseExecutableMingwX64 linkStressReleaseExecutableMingwX64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $project 'build/bin/mingwX64/releaseExecutable/iocp-probe.exe'
          Get-FileHash -Algorithm SHA256 $binary
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 (Join-Path $project 'build/bin/mingwX64/serverReleaseExecutable/nativeserve-iocp.exe')
      - name: Exercise real IOCP sockets, limits and shutdown
        shell: pwsh
        run: |
          $fixture = 'components/nativeserve/experiments/windows-iocp/build/bin/mingwX64/stressReleaseExecutable/nativeserve-iocp-stress.exe'
          $env:NATIVESERVE_BACKEND = 'iocp'
          python scripts/tests/reactor_stress.py $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
