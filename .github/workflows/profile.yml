name: Linux diagnostic profiles

on:
  pull_request:
    paths:
      - 'scripts/profile.sh'
      - '.github/workflows/profile.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Select HTTP CPU stacks, JSON stages, or paired route dispatch measurements
        type: choice
        options: [core, application, json-phases, json-http, routing]
        default: core

permissions:
  contents: read

jobs:
  profiles:
    if: inputs.suite != 'json-phases' && inputs.suite != 'json-http' && inputs.suite != 'routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      RUSTUP_TOOLCHAIN: '1.100.0'
      BENCHMARK_SUITE: ${{ inputs.suite || 'core' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - name: Install diagnostic tools
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y wrk linux-tools-generic
      - name: Build the core release variants
        run: ./scripts/build-all.sh
      - name: Sample CPU stacks and JVM events
        id: sample
        run: |
          export PERF_BIN="$(find -L /usr/lib/linux-tools -name perf -type f | sort -V | tail -1)"
          if [[ ! -x "$PERF_BIN" ]]; then
            echo 'The installed Linux tools did not provide an executable perf.' >&2
            exit 1
          fi
          PERF_SUDO=1 ./scripts/profile.sh "$RUNNER_TEMP/profiles"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() && steps.sample.outcome != 'skipped' }}
        with:
          name: exploratory-linux-x86_64-profiles
          path: ${{ runner.temp }}/profiles
          if-no-files-found: error

  json-probe-build:
    if: inputs.suite == 'json-phases' || inputs.suite == 'json-http'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - name: Link both release probes
        run: |
          project=components/ktserve
          mkdir -p "$RUNNER_TEMP/json-probes"
          for arch in x86_64 aarch64; do
            bash scripts/ci-gradle.sh -p "$project" -Pbenchmark.targetArch="$arch" \
              linkJsonProbeReleaseExecutableNative linkJsonHeapProbeReleaseExecutableNative
            cp "$project/build/bin/native/jsonProbeReleaseExecutable/ktserve-json-probe.kexe" "$RUNNER_TEMP/json-probes/$arch"
            cp "$project/build/bin/native/jsonHeapProbeReleaseExecutable/ktserve-json-heap-probe.kexe" "$RUNNER_TEMP/json-probes/$arch-heap"
          done
          gradle --version > "$RUNNER_TEMP/json-probes/gradle-version.txt"
          sed -n 's/.*kotlin("multiplatform") version "\(.*\)".*/kotlin=\1/p' "$project/build.gradle.kts" \
            > "$RUNNER_TEMP/json-probes/toolchain.txt"
          sed -n 's/.*kotlinx-serialization-json:\([^"]*\)".*/kotlinx.serialization=\1/p' "$project/build.gradle.kts" \
            >> "$RUNNER_TEMP/json-probes/toolchain.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-json-probes
          path: ${{ runner.temp }}/json-probes
          if-no-files-found: error

  json-phases:
    needs: json-probe-build
    if: inputs.suite == 'json-phases'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      JSON_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-json-probes
          path: ${{ runner.temp }}/json-probes
      - name: Measure the JSON phases on one logical CPU
        run: |
          test "$(uname -m)" = "$JSON_ARCH"
          binary="$RUNNER_TEMP/json-probes/$JSON_ARCH"
          chmod +x "$binary" "$binary-heap"
          python3 scripts/profile-json-phases.py "$binary" "$binary-heap" "$RUNNER_TEMP/json-phases"
          cp "$RUNNER_TEMP/json-probes/"*.txt "$RUNNER_TEMP/json-phases/"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: exploratory-json-phases-${{ matrix.arch }}
          path: ${{ runner.temp }}/json-phases
          if-no-files-found: warn

  json-http:
    needs: json-probe-build
    if: inputs.suite == 'json-http'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            vegeta_arch: amd64
            checksum: e8759ce45c14e18374bdccd3ba6068197bc3a9f9b7e484db3837f701b9d12e61
          - runner: ubuntu-24.04-arm
            arch: aarch64
            vegeta_arch: arm64
            checksum: 950381173a5575e25e8e086f36fc03bf65d61a2433329b48e41e1cb5e4133bba
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      JSON_ARCH: ${{ matrix.arch }}
      VEGETA_ARCH: ${{ matrix.vegeta_arch }}
      VEGETA_CHECKSUM: ${{ matrix.checksum }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-json-probes
          path: ${{ runner.temp }}/json-probes
      - name: Install Vegeta
        run: |
          asset="vegeta_12.13.0_linux_$VEGETA_ARCH.tar.gz"
          curl -fsSL --retry 3 "https://github.com/tsenart/vegeta/releases/download/v12.13.0/$asset" -o "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$VEGETA_CHECKSUM" "$RUNNER_TEMP/$asset" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" vegeta
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check and measure the JSON response paths
        run: |
          test "$(uname -m)" = "$JSON_ARCH"
          binary="$RUNNER_TEMP/json-probes/$JSON_ARCH"
          chmod +x "$binary"
          result="$RUNNER_TEMP/json-http"
          python3 scripts/profile-json-http.py "$binary" "$result" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/json-probes/"*.txt "$result/"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: exploratory-json-http-${{ matrix.arch }}
          path: ${{ runner.temp }}/json-http
          if-no-files-found: warn

  routing-build:
    if: inputs.suite == 'routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: baseline
          ref: '152a5fb8aed62fda87473d815d0e312e79337254'
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: deferred
          ref: '161280e44e4699fc1b620b7af0e3f85cfb9ccaa8'
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - name: Build the exact route probes for Linux Native and JVM
        run: |
          for variant in baseline deferred candidate; do
            project="$variant/components/ktserve"
            artifact="probes/$variant"
            mkdir -p "$artifact"
            git -C "$variant" rev-parse HEAD > "$artifact/source.sha"
            gradle --version > "$artifact/toolchain.txt"
            grep -m 1 'kotlin("multiplatform") version' "$project/build.gradle.kts" >> "$artifact/toolchain.txt"
            gradle -p "$project" -Pbenchmark.routingProbe routingProbeJvmDist
            cp -R "$project/build/routingProbeJvm/." "$artifact/"
            for arch in x86_64 aarch64; do
              gradle -p "$project" -Pbenchmark.routingProbe "-Pbenchmark.targetArch=$arch" linkRoutingProbeReleaseExecutableNative
              cp "$project/build/bin/native/routingProbeReleaseExecutable/ktserve-routing-probe.kexe" "$artifact/$arch"
            done
          done
          test "$(cat probes/candidate/source.sha)" = "$GITHUB_SHA"
          (cd probes && sha256sum */x86_64 */aarch64 */app.jar */lib/*.jar > inputs.sha256)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: routing-probes-${{ github.run_attempt }}
          path: probes/
          if-no-files-found: error

  routing:
    name: Routing (${{ matrix.runtime }}, ${{ matrix.arch }})
    needs: routing-build
    if: inputs.suite == 'routing'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, runtime: native }
          - { runner: ubuntu-24.04-arm, arch: aarch64, runtime: native }
          - { runner: ubuntu-24.04, arch: x86_64, runtime: jvm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: matrix.runtime == 'jvm'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: routing-probes-${{ github.run_attempt }}
          path: probes/
      - name: Measure dispatch, throughput and fixed-rate p99
        env:
          ARCH: ${{ matrix.arch }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          test "$(uname -m)" = "$ARCH"
          (cd probes && sha256sum --strict --check inputs.sha256)
          sudo apt-get update -qq
          sudo apt-get install -y wrk time
          bash scripts/install-k6.sh "$RUNNER_TEMP/k6"
          export PATH="$RUNNER_TEMP/k6:$PATH"
          root="$RUNNER_TEMP/routing"
          mkdir -p "$root"
          cp probes/inputs.sha256 "$root/"
          { java -version; dpkg-query -W wrk time; k6 version; } > "$root/versions.txt" 2>&1
          args=()
          for variant in baseline deferred candidate; do
            cp "probes/$variant/source.sha" "$root/$variant.sha"
            cp "probes/$variant/toolchain.txt" "$root/$variant.toolchain"
            if [[ "$RUNTIME" == jvm ]]; then
              command="java -Xms128m -Xmx512m -cp probes/$variant/app.jar:probes/$variant/lib/* codes.draeger.ktserve.benchmark.RoutingProbeKt"
            else
              chmod +x "probes/$variant/$ARCH"
              command="probes/$variant/$ARCH"
            fi
            args+=(--variant "$variant=$command")
          done
          failed=0
          python3 scripts/benchmark-routing.py "${args[@]}" --output "$root/match" --only match || failed=1
          python3 scripts/benchmark-routing.py "${args[@]}" --output "$root/saturation" --only http \
            --resources 1 512 --repeats 3 || failed=1
          python3 scripts/benchmark-routing.py "${args[@]}" --output "$root/fixed" --only http \
            --resources 1 512 --repeats 3 --rate 5000 || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: exploratory-routing-${{ matrix.runtime }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing
          if-no-files-found: warn
