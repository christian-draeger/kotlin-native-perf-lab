name: ktServe epoll trigger comparison

on:
  pull_request:
    paths:
      - '.github/workflows/epoll-trigger.yml'
      - 'components/ktserve/src/nativeMain/kotlin/io/github/christian_draeger/ktserve/transport/EpollTransport.kt'
      - 'scripts/benchmark-epoll-trigger.sh'
      - 'scripts/tests/epoll_trigger_smoke.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  arm_native:
    uses: ./.github/workflows/arm-native.yml
    with:
      smoke_fixtures: true
      reuse_smoke: true

  compare:
    needs: arm_native
    name: Compare level and edge peers (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        if: matrix.arch == 'x86_64'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: matrix.arch == 'x86_64'
        with:
          gradle-version: '9.7.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.arch == 'aarch64'
        with:
          artifact-ids: ${{ needs.arm_native.outputs.artifact_id }}
          run-id: ${{ needs.arm_native.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/epoll-arm-build
      - name: Build or install the release executable and stress fixture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          sudo apt-get update -qq
          sudo apt-get install -y wrk time
          project=components/ktserve
          fixture="$RUNNER_TEMP/ktserve-stress-fixture.kexe"
          if [[ "$EXPECTED_ARCH" == aarch64 ]]; then
            install -D -m 755 "$RUNNER_TEMP/epoll-arm-build/ktserve.kexe" "$project/build/bin/native/releaseExecutable/ktserve.kexe"
            install -m 755 "$RUNNER_TEMP/epoll-arm-build/ktserve-stress-fixture.kexe" "$fixture"
          else
            gradle -p "$project" linkReleaseExecutableNative linkStressReleaseExecutableNative
            install -m 755 "$project/build/bin/native/stressReleaseExecutable/ktserve-stress-fixture.kexe" "$fixture"
          fi
      - name: Check queues, cancellation and shutdown, then measure both modes
        id: measure
        env:
          RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
          WARMUP: ${{ github.event_name == 'pull_request' && '2' || '5' }}
          DURATION: ${{ github.event_name == 'pull_request' && '2' || '5' }}
        run: |
          result="$RUNNER_TEMP/epoll-trigger"
          bash scripts/benchmark-epoll-trigger.sh "$result" "$RUNNER_TEMP/ktserve-stress-fixture.kexe"
          cat "$result/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify coroutine wake-ups in both peer modes
        run: |
          for trigger in level edge; do
            KTSERVE_EPOLL_APPLICATION_WAKEUP=eventfd KTSERVE_EPOLL_TRIGGER="$trigger" \
              python3 scripts/tests/ktserve_stress.py "$RUNNER_TEMP/ktserve-stress-fixture.kexe"
          done
      - name: Check eventfd close and descriptor reuse
        if: matrix.arch == 'x86_64' && github.event_name == 'pull_request'
        run: gradle -p components/ktserve nativeTest
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure') }}
        with:
          name: epoll-trigger-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epoll-trigger
          if-no-files-found: error
