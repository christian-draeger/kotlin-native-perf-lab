name: ktServe inference CPU reference

on:
  pull_request:
    paths:
      - 'components/ktserve/experiments/inference/**'
      - '.github/workflows/inference-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check the real CPU model
        working-directory: components/ktserve/experiments/inference
        run: |
          python -m pip install -r requirements.txt
          python verify_cpu.py "$RUNNER_TEMP/ktserve-inference-model"
      - name: Verify the ktServe HTTP example, deadline and cancellation
        run: |
          experiment=components/ktserve/experiments/inference
          components/ktserve/gradlew -p "$experiment" installDist
          python "$experiment/smoke_http.py" \
            "$experiment/build/install/ktserve-inference-example/bin/ktserve-inference-example" \
            "$RUNNER_TEMP/ktserve-inference-model"
