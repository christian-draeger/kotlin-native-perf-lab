name: ktServe inference CPU reference

on:
  pull_request:
    paths:
      - 'components/ktserve/experiments/inference/**'
      - '.github/workflows/inference-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check the real CPU model
        working-directory: components/ktserve/experiments/inference
        run: |
          python -m pip install -r requirements.txt
          python verify_cpu.py "$RUNNER_TEMP/ktserve-inference-model"
