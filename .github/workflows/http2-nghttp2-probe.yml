name: HTTP/2 session probe

on:
  push:
    branches: [main]
    paths: &paths
      - 'components/ktserve/experiments/http2-nghttp2/**'
      - '.github/workflows/http2-nghttp2-probe.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      run_pilot:
        description: Run the exploratory ktServe and Axum HTTP/2 comparison on both Linux architectures
        type: boolean
        default: false
      tls_ingress:
        description: Put each origin behind the same Caddy TLS configuration when running the pilot
        type: boolean
        default: false
      pilot_workload:
        description: Response fixture to measure in the HTTP/2 pilot
        type: choice
        options: [json, stream]
        default: json

permissions:
  contents: read

jobs:
  arm_sdk:
    name: Prepare the Ubuntu ARM64 nghttp2 SDK
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Extract the signed distribution package
        run: |
          sudo apt-get update -qq
          cd "$RUNNER_TEMP"
          apt-get download libnghttp2-dev
          package=(libnghttp2-dev_*.deb)
          test "${#package[@]}" = 1
          test "$(dpkg-deb -f "${package[0]}" Architecture)" = arm64
          dpkg-deb -x "${package[0]}" arm-package
          mkdir -p arm-sdk/usr/include arm-sdk/usr/lib/aarch64-linux-gnu
          cp -R arm-package/usr/include/nghttp2 arm-sdk/usr/include/
          cp arm-package/usr/lib/aarch64-linux-gnu/libnghttp2.a arm-sdk/usr/lib/aarch64-linux-gnu/
          cp arm-package/usr/share/doc/libnghttp2-dev/copyright arm-sdk/LICENSE.nghttp2
          dpkg-deb -f "${package[0]}" Version | tee arm-sdk/package-version.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nghttp2-sdk-arm64
          path: ${{ runner.temp }}/arm-sdk
          if-no-files-found: error

  build:
    name: Build both Kotlin/Native probes and test x86_64
    needs: arm_sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nghttp2-sdk-arm64
          path: ${{ runner.temp }}/arm-sdk
      - name: Install x86_64 SDK from Ubuntu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libnghttp2-dev python3-h2
          dpkg-query -W libnghttp2-dev
          cat "$RUNNER_TEMP/arm-sdk/package-version.txt"
          mkdir "$RUNNER_TEMP/x86-headers"
          cp -R /usr/include/nghttp2 "$RUNNER_TEMP/x86-headers/"
          cd "$RUNNER_TEMP"
          apt-get download caddy
          dpkg-deb -x caddy_*.deb proxy
          "$RUNNER_TEMP/proxy/usr/bin/caddy" version
      - name: Build and exercise both architectures
        run: |
          project=components/ktserve/experiments/http2-nghttp2
          binary="$project/build/bin/native/releaseExecutable/ktserve-http2-session-probe.kexe"
          server="$project/build/bin/native/h2cReleaseExecutable/ktserve-h2c.kexe"
          cc -Wall -Wextra -Werror -fsyntax-only -include "$project/src/nativeInterop/cinterop/http2_probe.h" -xc /dev/null
          gradle -p "$project" -Pbenchmark.targetArch=x86_64 -Pnghttp2.headers="$RUNNER_TEMP/x86-headers" \
            -Pnghttp2.archive=/usr/lib/x86_64-linux-gnu/libnghttp2.a linkReleaseExecutableNative linkH2cReleaseExecutableNative
          "$binary"
          bash "$project/smoke.sh" "$server"
          bash "$project/ingress/smoke.sh" "$server" "$RUNNER_TEMP/proxy/usr/bin/caddy"
          if [[ "$RUN_PILOT" == true ]]; then
            mkdir "$RUNNER_TEMP/h2-x86"
            install -m 755 "$server" "$RUNNER_TEMP/h2-x86/ktserve-h2c"
            dpkg-query -W -f='${Version}\n' libnghttp2-dev > "$RUNNER_TEMP/h2-x86/package-version.txt"
          fi
          gradle -p "$project" -Pbenchmark.targetArch=aarch64 -Pnghttp2.headers="$RUNNER_TEMP/arm-sdk/usr/include" \
            -Pnghttp2.archive="$RUNNER_TEMP/arm-sdk/usr/lib/aarch64-linux-gnu/libnghttp2.a" \
            linkReleaseExecutableNative linkH2cReleaseExecutableNative
          readelf -h "$binary" | grep -E 'Machine:[[:space:]]+AArch64$'
          readelf -h "$server" | grep -E 'Machine:[[:space:]]+AArch64$'
          mkdir "$RUNNER_TEMP/h2-arm"
          install -m 755 "$binary" "$RUNNER_TEMP/h2-arm/h2-probe"
          install -m 755 "$server" "$RUNNER_TEMP/h2-arm/ktserve-h2c"
          cp "$project/smoke.sh" "$RUNNER_TEMP/h2-arm/"
          cp "$project/multiplex_smoke.py" "$RUNNER_TEMP/h2-arm/"
          cp -R "$project/ingress" "$RUNNER_TEMP/h2-arm/"
          cp "$RUNNER_TEMP/arm-sdk/LICENSE.nghttp2" "$RUNNER_TEMP/h2-arm/"
          cp "$RUNNER_TEMP/arm-sdk/package-version.txt" "$RUNNER_TEMP/h2-arm/"
        env:
          RUN_PILOT: ${{ inputs.run_pilot || false }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.run_pilot
        with:
          name: nghttp2-probe-x86_64
          path: ${{ runner.temp }}/h2-x86
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nghttp2-probe-arm64
          path: ${{ runner.temp }}/h2-arm
          if-no-files-found: error

  arm_smoke:
    name: Run the HTTP/2 probe on ARM64
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nghttp2-probe-arm64
          path: ${{ runner.temp }}/h2-arm
      - run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y python3-h2
          chmod +x "$RUNNER_TEMP/h2-arm/h2-probe" "$RUNNER_TEMP/h2-arm/ktserve-h2c"
          "$RUNNER_TEMP/h2-arm/h2-probe"
          bash "$RUNNER_TEMP/h2-arm/smoke.sh" "$RUNNER_TEMP/h2-arm/ktserve-h2c"
      - name: Verify TLS ALPN through the ingress
        run: |
          sudo apt-get update -qq
          cd "$RUNNER_TEMP"
          apt-get download caddy
          dpkg-deb -x caddy_*.deb proxy
          "$RUNNER_TEMP/proxy/usr/bin/caddy" version
          bash "$RUNNER_TEMP/h2-arm/ingress/smoke.sh" "$RUNNER_TEMP/h2-arm/ktserve-h2c" "$RUNNER_TEMP/proxy/usr/bin/caddy"

  h2c_pilot:
    name: Exploratory HTTP/2 pilot (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_pilot
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nghttp2-probe-${{ matrix.arch }}
          path: ${{ runner.temp }}/ktserve-h2c
      - name: Build the protocol-enabled Axum release and install h2load
        run: |
          chmod +x "$RUNNER_TEMP/ktserve-h2c/ktserve-h2c"
          sudo apt-get update -qq
          sudo apt-get install -y nghttp2-client strace time
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 build --manifest-path competitors/rust-axum/Cargo.toml \
            --release --locked --features http2 --target-dir "$RUNNER_TEMP/axum-h2c"
      - name: Build the pinned TLS load client
        if: inputs.tls_ingress
        run: |
          sudo apt-get install -y cmake g++-14 libev-dev libssl-dev ninja-build pkg-config zlib1g-dev
          stage="$(mktemp -d "$RUNNER_TEMP/h2load.XXXXXX")"
          cd "$stage"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/nghttp2/nghttp2/releases/download/v1.71.0/nghttp2-1.71.0.tar.xz \
            --output nghttp2-1.71.0.tar.xz
          printf '%s  %s\n' c0f55121d88650e4b9227aec28cebaf664d2417ca60fe70be0f8d38829f52116 \
            nghttp2-1.71.0.tar.xz | sha256sum --check
          tar -xf nghttp2-1.71.0.tar.xz
          cmake -S nghttp2-1.71.0 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DENABLE_APP=ON \
            -DENABLE_EXAMPLES=OFF -DENABLE_HPACK_TOOLS=OFF -DENABLE_DOC=OFF -DBUILD_TESTING=OFF
          cmake --build build --target h2load --parallel 2
          build/src/h2load --version
          printf '%s\n' "$stage/build/src" >> "$GITHUB_PATH"
      - name: Compare the matched HTTP/2 workload
        env:
          TLS_INGRESS: ${{ inputs.tls_ingress }}
          WORKLOAD: ${{ inputs.pilot_workload }}
        run: |
          args=()
          if [[ "$TLS_INGRESS" == true ]]; then
            stage="$(mktemp -d "$RUNNER_TEMP/caddy-bench.XXXXXX")"
            (
              cd "$stage"
              apt-get download caddy
              dpkg-deb -x caddy_*.deb unpacked
            )
            args+=(--caddy "$stage/unpacked/usr/bin/caddy")
          fi
          python3 components/ktserve/experiments/http2-nghttp2/benchmark.py \
            --ktserve "$RUNNER_TEMP/ktserve-h2c/ktserve-h2c" \
            --axum "$RUNNER_TEMP/axum-h2c/release/axum-baseline" \
            --output "$RUNNER_TEMP/h2-results" --workload "$WORKLOAD" "${args[@]}"
      - name: Record toolchain versions
        if: ${{ always() && !cancelled() }}
        run: |
          test -d "$RUNNER_TEMP/h2-results" || exit 0
          {
            printf 'kotlin_native=2.4.21\naxum=0.8.9\nnghttp2_sdk='
            cat "$RUNNER_TEMP/ktserve-h2c/package-version.txt"
            rustc +1.100.0 -Vv
          } >> "$RUNNER_TEMP/h2-results/environment.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() && !cancelled() }}
        with:
          name: ${{ inputs.tls_ingress && 'h2-tls' || 'h2c' }}-pilot${{ inputs.pilot_workload == 'stream' && '-stream' || '' }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h2-results
          if-no-files-found: warn
