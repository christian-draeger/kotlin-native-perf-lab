name: Benchmark dashboard

on:
  push:
    branches: [main, feat/phase-0-baseline]
    paths:
      - 'results/**'
      - 'dashboard/**'
      - 'scripts/build-dashboard.py'
      - 'scripts/tests/test_dashboard.py'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'results/**'
      - 'dashboard/**'
      - 'scripts/build-dashboard.py'
      - 'scripts/tests/test_dashboard.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate and build dashboard
        run: |
          python3 -m unittest discover -s scripts/tests
          node --check dashboard/app.js
          python3 scripts/build-dashboard.py dist
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'feat/phase-0-baseline')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
