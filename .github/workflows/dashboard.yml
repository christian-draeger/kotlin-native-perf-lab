name: Benchmark dashboard

on:
  push:
    branches: [main]
    paths:
      - 'results/**'
      - 'dashboard/**'
      - 'scripts/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'results/**'
      - 'dashboard/**'
      - 'scripts/**'
      - '.github/workflows/dashboard.yml'
  workflow_run:
    workflows: ['ktServe integration benchmarks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: Run the Ubuntu x86_64 and ARM64 benchmarks before publishing
        type: boolean
        default: true
      repetitions:
        description: Trials per server and endpoint
        type: choice
        options: ['3', '5']
        default: '5'
      suite:
        description: Complete ranking, core feedback, application workload, or worker experiment
        type: choice
        options: [expanded, core, application, application-mix, workers]
        default: expanded
      application_mix_profile:
        description: Connection or overload profile for the application-mix suite
        type: choice
        options: [persistent, churn, overload]
        default: persistent
      worker_reference_run:
        description: Successful main Ubuntu smoke run ID supplying the workers suite reference
        type: string
      compare_worker_listeners:
        description: In the workers suite, include two workers with per-worker SO_REUSEPORT listeners
        type: boolean
        default: false
      benchmark_label:
        description: Optional feature or change label shown in ktServe history
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('benchmark-dashboard-pr-{0}', github.event.pull_request.number) || (inputs.suite == 'workers' && format('worker-benchmark-{0}', github.ref)) || (inputs.suite == 'application-mix' && github.ref_name != 'main' && format('application-mix-{0}-{1}', github.ref, inputs.application_mix_profile)) || 'benchmark-dashboard-publish' }}
  # Keep queued measurements and archive imports when a main push adds a Pages build.
  queue: max

jobs:
  arm_native:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark && (github.ref_name == 'main' || inputs.suite == 'workers' || inputs.suite == 'application-mix')
    uses: ./.github/workflows/arm-native.yml
    with:
      reuse_smoke: true

  benchmark:
    needs: arm_native
    if: ${{ !cancelled() && needs.arm_native.result != 'skipped' }}
    name: benchmark (${{ matrix.arch }}, ${{ matrix.route }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        route: ${{ fromJSON(inputs.suite == 'application' && '["catalog"]' || inputs.suite == 'application-mix' && '["mix"]' || '["health","json","users"]') }}
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.suite == 'application-mix' && inputs.application_mix_profile == 'overload' && 50 || 35 }}
    permissions:
      actions: read
      contents: read
    env:
      LC_ALL: C
      RUSTUP_TOOLCHAIN: '1.100.0'
      EXPECTED_ARCH: ${{ matrix.arch }}
      BENCHMARK_SUITE: ${{ inputs.suite }}
      COMPARE_WORKER_LISTENERS: ${{ inputs.compare_worker_listeners }}
      BENCHMARK_ENDPOINT: ${{ matrix.route == 'catalog' && '/catalog/123' || matrix.route == 'users' && '/users/123' || format('/{0}', matrix.route) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.7.0'
      - uses: ./.github/actions/setup-competitors
        if: inputs.suite == 'expanded'
      - name: Install wrk and Rust
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          sudo apt-get update -qq
          sudo apt-get install -y wrk time
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check the ARM64 cross-build
        if: matrix.arch == 'aarch64'
        env:
          NATIVE_ARTIFACT: ${{ needs.arm_native.outputs.artifact_id }}
        run: test -n "$NATIVE_ARTIFACT"
      - name: Install k6 for the application mix
        if: inputs.suite == 'application-mix'
        run: |
          bash scripts/install-k6.sh "$RUNNER_TEMP/k6"
          printf '%s\n' "$RUNNER_TEMP/k6" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.arch == 'aarch64'
        with:
          artifact-ids: ${{ needs.arm_native.outputs.artifact_id }}
          run-id: ${{ needs.arm_native.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/arm-native
      - name: Prepare the worker reference and CPU affinity
        if: inputs.suite == 'workers'
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_RUN: ${{ inputs.worker_reference_run }}
        run: |
          [[ "$REFERENCE_RUN" =~ ^[0-9]+$ ]]
          reference="$RUNNER_TEMP/worker-reference"
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REFERENCE_RUN")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .name == "Ubuntu smoke" and .conclusion == "success" and .head_branch == "main"
            and .head_repository.full_name == $repo
          ' <<<"$info" >/dev/null
          sha="$(jq -er '.head_sha' <<<"$info")"
          attempt="$(jq -er '.run_attempt' <<<"$info")"
          suffix="-linux-$EXPECTED_ARCH-$attempt"
          prefix="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REFERENCE_RUN/artifacts?per_page=100" \
            | jq -er --arg suffix "$suffix" '
              [.artifacts[] | select(.expired == false) | .name] as $available
              | ["ktserve", "nativeserve"]
              | map(. as $prefix | select($available | index($prefix + $suffix)))
              | first // empty
            ')"
          gh run download "$REFERENCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$prefix$suffix" --dir "$reference"
          archive="$prefix-snapshot-${sha:0:12}-linux-$EXPECTED_ARCH.tar.gz"
          (cd "$reference"; sha256sum --strict -c "$archive.sha256"; tar -xzf "$archive" "$prefix")
          printf 'KTSERVE_REFERENCE_BINARY=%s/%s\nKTSERVE_REFERENCE_SHA=%s\n' "$reference" "$prefix" "$sha" >> "$GITHUB_ENV"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 4:
              raise SystemExit("The workers suite needs at least four available logical CPUs.")
          print("SERVER_CPUS=" + ",".join(map(str, cpus[:2])))
          print("LOAD_CPUS=" + ",".join(map(str, cpus[2:4])))
          PY
      - name: Build and smoke-test all baselines
        run: |
          if [[ "$EXPECTED_ARCH" == aarch64 ]]; then
            export PREBUILT_KOTLIN_DIR="$RUNNER_TEMP/arm-native"
          fi
          ./scripts/build-all.sh
          if [[ "$BENCHMARK_SUITE" == expanded ]]; then
            bash scripts/build-competitors.sh
          fi
          if [[ "$BENCHMARK_SUITE" == workers ]]; then
            BENCHMARK_SUITE=core ./scripts/smoke-all.sh
          else
            ./scripts/smoke-all.sh
          fi
      - name: Measure on the hosted Linux runner
        id: measure
        env:
          RUNS: ${{ inputs.repetitions }}
          WARMUP: 10
          DURATION: 5
          THREADS: 2
          APPLICATION_PROFILE: ${{ inputs.application_mix_profile || 'persistent' }}
          CONNECTIONS: ${{ inputs.suite == 'workers' && '64' || '16' }}
          BENCHMARK_LABEL: ${{ inputs.benchmark_label }}
        run: |
          export BENCHMARK_RESULTS_DIR="$RUNNER_TEMP/benchmark-results"
          if [[ "$BENCHMARK_SUITE" == application-mix ]]; then
            result="$BENCHMARK_RESULTS_DIR/$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$result"
            grep '^PRETTY_NAME=' /etc/os-release > "$result/environment.txt"
            printf 'kotlin_version=%s\n' "$(sed -n 's/.*kotlin("multiplatform") version "\([^"]*\)".*/\1/p' components/ktserve/build.gradle.kts)" >> "$result/environment.txt"
            profile_args=(--application-profile "$APPLICATION_PROFILE")
            if [[ "$APPLICATION_PROFILE" == overload ]]; then
              profile_args+=(--rates 800 3200 6400 --vus 48)
              DURATION=10
            fi
            python3 scripts/benchmark-integrations.py --family application-mix --executable scripts/run-server.sh \
              --output "$result" --repeats "$RUNS" --warmup "$WARMUP" --precondition "$WARMUP" \
              --duration "$DURATION" --threads "$THREADS" "${profile_args[@]}"
          else
            ./scripts/benchmark.sh
          fi
      - name: Measure worker tail latency at matched offered load
        if: inputs.suite == 'workers' && matrix.route == 'json'
        run: |
          case "$EXPECTED_ARCH" in
            x86_64) arch=amd64; checksum=e8759ce45c14e18374bdccd3ba6068197bc3a9f9b7e484db3837f701b9d12e61 ;;
            aarch64) arch=arm64; checksum=950381173a5575e25e8e086f36fc03bf65d61a2433329b48e41e1cb5e4133bba ;;
          esac
          asset="vegeta_12.13.0_linux_$arch.tar.gz"
          curl -fsSL --retry 3 "https://github.com/tsenart/vegeta/releases/download/v12.13.0/$asset" -o "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$asset" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" vegeta
          export PATH="$RUNNER_TEMP:$PATH"
          ./scripts/benchmark-worker-latency.sh "$RUNNER_TEMP/worker-latency/default"
          if [[ "$EXPECTED_ARCH" == x86_64 ]]; then
            alternate="$(python3 scripts/worker-topology.py --alternative "$SERVER_CPUS" "$LOAD_CPUS")"
            if [[ -n "$alternate" ]]; then
              read -r alternate_server alternate_load <<<"$alternate"
              SERVER_CPUS="$alternate_server" LOAD_CPUS="$alternate_load" \
                ./scripts/benchmark-worker-latency.sh "$RUNNER_TEMP/worker-latency/alternate-smt"
            fi
          fi
      - name: Upload matched-load raw results
        if: ${{ !cancelled() && inputs.suite == 'workers' && matrix.route == 'json' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: worker-latency-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-latency
          if-no-files-found: warn
      - name: Record CI provenance and retain available logs
        id: capture
        if: ${{ !cancelled() && steps.measure.outcome != 'skipped' }}
        env:
          BENCHMARK_OUTCOME: ${{ steps.measure.outcome }}
          RUNNER_LABEL: ${{ matrix.runner }}
          ROUTE: ${{ matrix.route }}
          NATIVE_BUILD_RUN: ${{ matrix.arch == 'aarch64' && needs.arm_native.outputs.artifact_run_id || github.run_id }}
        run: |
          shopt -s nullglob
          archive="$RUNNER_TEMP/benchmark-archive"
          for directory in "$RUNNER_TEMP"/benchmark-results/*; do
            printf 'benchmark_source=github-hosted-actions\nci_run_id=%s\nci_run_attempt=%s\nbenchmark_outcome=%s\nrunner_image=%s\nrunner_image_version=%s\nrunner_label=%s\nnative_build_arch=x86_64\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$BENCHMARK_OUTCOME" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_LABEL" >> "$directory/environment.txt"
            printf 'native_build_run_id=%s\n' "$NATIVE_BUILD_RUN" >> "$directory/environment.txt"
            mkdir -p "$archive"
            mv "$directory" "$archive/${directory##*/}-$EXPECTED_ARCH-$ROUTE"
            printf 'directory=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          done
      - name: Upload raw benchmark results
        if: ${{ !cancelled() && steps.capture.outputs.directory != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-benchmark-${{ matrix.arch }}-${{ matrix.route }}-${{ github.run_attempt }}
          path: ${{ steps.capture.outputs.directory }}
          if-no-files-found: error

  store:
    needs: benchmark
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.suite != 'workers'
          && (needs.benchmark.result == 'success' || needs.benchmark.result == 'failure'))
        || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'workflow_dispatch'
          && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
      ) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ${{ github.event_name == 'workflow_run' && format('integration-benchmark-*-{0}', github.event.workflow_run.run_attempt) || format('linux-benchmark-*-{0}', github.run_attempt) }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/raw-benchmark
      - name: Commit the raw results to benchmark-data
        env:
          SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
          SOURCE_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || github.run_attempt }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if git ls-remote --exit-code origin refs/heads/benchmark-data >/dev/null; then
            git fetch --no-tags --depth=1 origin refs/heads/benchmark-data
            git switch --detach FETCH_HEAD
          else
            [[ "$?" == 2 ]]
            git switch --orphan benchmark-data
          fi
          mkdir -p results
          shopt -s nullglob
          directories=("$RUNNER_TEMP"/raw-benchmark/*)
          test "${#directories[@]}" -gt 0
          series_count=0
          for directory in "${directories[@]}"; do
            series="${directory##*/}"
            if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
              [[ "$series" =~ ^[0-9]{8}T[0-9]{6}Z-(ktor-native|ktor-jvm|spring-webflux)-(x86_64|aarch64)$ ]]
              if [[ ! -s "$directory/results.csv" ]]; then
                echo "No measured trials in $series. See the source workflow logs."
                continue
              fi
              metadata="$directory/environment.txt"
              grep -Fxq "integration_family=${BASH_REMATCH[1]}" "$metadata"
              grep -Fxq "machine=${BASH_REMATCH[2]}" "$metadata"
              grep -Fxq 'benchmark_suite=integration' "$metadata"
              grep -Fxq 'benchmark_source=github-hosted-actions' "$metadata"
              grep -Fxq "git_sha=$SOURCE_SHA" "$metadata"
              grep -Fxq "ci_run_id=$SOURCE_RUN" "$metadata"
              grep -Fxq "ci_run_attempt=$SOURCE_ATTEMPT" "$metadata"
            else
              [[ "$series" =~ ^[0-9]{8}T[0-9]{6}Z-(x86_64|aarch64)-(health|json|users|catalog|mix)$ ]]
            fi
            series_count=$((series_count + 1))
            if [[ -e "results/$series" ]]; then
              diff -r -- "$directory" "results/$series"
              continue
            fi
            cp -R "$directory" "results/$series"
            git add -f -- "results/$series"
          done
          test "$series_count" -gt 0
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Record Linux CI benchmark run $SOURCE_RUN"
            git push origin HEAD:refs/heads/benchmark-data
          fi

  build:
    needs: [benchmark, store]
    if: ${{ !cancelled() && (needs.store.result == 'success' || (github.event_name != 'workflow_run' && needs.benchmark.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Load archived CI results
        run: |
          if git ls-remote --exit-code origin refs/heads/benchmark-data >/dev/null; then
            git fetch --no-tags --depth=1 origin refs/heads/benchmark-data
            git worktree add --detach "$RUNNER_TEMP/benchmark-data" FETCH_HEAD
          else
            [[ "$?" == 2 ]]
          fi
      - name: Validate and build dashboard
        run: |
          python3 -m unittest discover -s scripts/tests
          node --check dashboard/app.js
          if [[ -d "$RUNNER_TEMP/benchmark-data" ]]; then
            python3 scripts/build-dashboard.py dist --ci-checkout "$RUNNER_TEMP/benchmark-data"
          else
            python3 scripts/build-dashboard.py dist
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref_name == 'main' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
