import org.gradle.api.artifacts.repositories.MavenArtifactRepository

// Applied only by ci-gradle.sh after Maven Central returns HTTP 429.
gradle.beforeProject { project ->
    project.afterEvaluate {
        project.repositories.withType(MavenArtifactRepository).each { repository ->
            if (repository.url.host == 'repo.maven.apache.org' && repository.url.path == '/maven2/') {
                repository.url = 'https://maven-central.storage-download.googleapis.com/maven2/'
            }
        }
    }
}
