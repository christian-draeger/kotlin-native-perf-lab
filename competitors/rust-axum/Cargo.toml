[package]
name = "axum-baseline"
version = "0.1.0"
edition = "2021"

[features]
http2 = ["axum/http2"]

[dependencies]
axum = { version = "=0.8.9", features = ["json"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
